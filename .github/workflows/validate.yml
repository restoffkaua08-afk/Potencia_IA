name: Validate repository

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "CLAUDE.md"
            "MANIFEST.json"
            "bootstrap/BOOTSTRAP.md"
            "bootstrap/AGENT-POLICY.md"
            "prompts/01-iniciar-projeto.md"
            "prompts/02-continuar-projeto.md"
            "prompts/03-missao-autonoma.md"
          )
          for file in "${required[@]}"; do
            test -f "$file"
          done

      - name: Validate manifest JSON
        shell: bash
        run: python -m json.tool MANIFEST.json >/dev/null

      - name: Validate shell preflight syntax
        shell: bash
        run: bash -n bootstrap/preflight.sh

      - name: Run runtime tests
        run: python -m unittest discover -s tests -v

      - name: Validate CLI
        run: |
          potencia --version
          potencia doctor --workspace .

      - name: Validate community files
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f .github/CONTRIBUTING.md
          test -f .github/SECURITY.md
          test -f .github/CODE_OF_CONDUCT.md
          test -f .github/SUPPORT.md
